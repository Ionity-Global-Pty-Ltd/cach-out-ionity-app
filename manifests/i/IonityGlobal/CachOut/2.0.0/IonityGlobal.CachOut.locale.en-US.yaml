ShortDescription: One-click privacy, cache, DNS, SSL/certificate and network reset for Windows.
Description: >-
  CACH OUT Ionity is a compiled, digitally signed Windows utility that resets
  your privacy and network state in one click. It flushes DNS/ARP/NetBIOS/Winsock,
  clears every browser's cache and cookies, wipes temp/thumbnail/prefetch/font
  and Windows Update caches, clears SSL and certificate URL caches, can refresh
  trusted root certificates from Windows Update, and optionally blocks known
  trackers via a reversible, backed-up hosts entry.
